version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    rules:
      # Tests routinely ignore errors on setup/teardown calls where a failure would
      # surface as a test failure anyway; enforcing errcheck there is noise.
      - path: _test\.go
        linters:
          - errcheck

# gofmt is a formatter in v2, not a linter. CI also enforces `gofmt -l` directly.
formatters:
  enable:
    - gofmt
