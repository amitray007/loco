name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (short)
        run: go test -short ./...

      - name: Test (race, short)
        run: go test -race -short ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Build linux/amd64
        run: GOOS=linux GOARCH=amd64 go build ./cmd/loco
        env:
          CGO_ENABLED: 0

      - name: Build linux/arm64
        run: GOOS=linux GOARCH=arm64 go build ./cmd/loco
        env:
          CGO_ENABLED: 0

      - name: Build darwin/amd64
        run: GOOS=darwin GOARCH=amd64 go build ./cmd/loco
        env:
          CGO_ENABLED: 0

      - name: Build darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go build ./cmd/loco
        env:
          CGO_ENABLED: 0

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      # v9 + golangci-lint v2 are required: the v6 action pulled a lint binary built
      # with go1.24, which refuses to load a module targeting go1.26.1
      # ("the Go language version used to build golangci-lint is lower than the
      # targeted Go version"). The SHA below is a v9 release; keep it there.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      # A tag is mutable: `@v7` re-resolves every run, so moving it — via a compromised
      # maintainer account or a token leak in the action's own repo — executes new code
      # here with no diff, no PR, and no Dependabot alert. This repo's CI has
      # contents:write and the release path handles a tap PAT, so that is a real target.
      # ci.yml drifted to 13 floating tags while release-please.yml pinned SHAs (#18);
      # the two styles are indistinguishable in a Dependabot diff, so only a check
      # catches the drift.
      - name: Actions are pinned to SHAs
        run: |
          set -euo pipefail
          # Match `uses: owner/repo@ref`, ignoring local (./) and docker:// actions.
          unpinned=$(grep -rEn '^\s*-?\s*uses:\s*[^./][^@]+@' .github/workflows/ \
            | grep -vE '@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::Actions must be pinned to a full 40-character commit SHA (#18)."
            echo "Add a trailing '# vX.Y.Z' comment; Dependabot keeps both updated."
            echo "$unpinned"
            exit 1
          fi
          echo "All actions are pinned to full commit SHAs."

  # Validate the release pipeline itself on every PR. Without this, a typo in
  # .goreleaser.yaml or the formula template only surfaces during an actual
  # release — after the tag exists and the version has been burned.
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # goreleaser reads tags and commit history to derive its version.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Validate goreleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check

      # Build against a REAL tag in exactly the format release-please creates,
      # rather than --snapshot. A snapshot bypasses goreleaser's tag parsing and
      # derives its version from version_template, so it is structurally unable
      # to catch a tag/filename mismatch — which is the one failure that burns a
      # version number, because it only surfaces AFTER the tag and release exist.
      #
      # Concretely: with include-component-in-tag left at its default (true),
      # release-please tags `loco-v0.1.2`; goreleaser rejects that as non-semver
      # and emits `loco_loco-v0.1.2_darwin_arm64.tar.gz`, while the publish job
      # looks for `loco_0.1.2_darwin_arm64.tar.gz` and dies. This step fails on
      # that config and passes on the current one.
      - name: Build against a release-please-formatted tag
        run: |
          set -euo pipefail
          # Mirrors release-please's tag rendering for this config:
          # include-v-in-tag: true, include-component-in-tag: false → vX.Y.Z
          NEXT="99.99.99"
          TAG="v${NEXT}"
          # Lightweight tag, not annotated (-m): an annotated tag needs a
          # committer identity, which a bare runner has not configured. The tag
          # name is all goreleaser reads.
          git tag -f "$TAG"
          echo "probing with tag: $TAG"
          echo "PROBE_VERSION=${NEXT}" >> "$GITHUB_ENV"

      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --skip=publish --skip=validate

      # Assert the artifacts are named exactly what the publish job hardcodes.
      # This is the assertion that catches a tag-format regression.
      - name: Assert artifact names match what publish expects
        run: |
          set -euo pipefail
          VERSION="${PROBE_VERSION}"
          missing=0
          for f in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            path="dist/loco_${VERSION}_${f}.tar.gz"
            if [ ! -f "$path" ]; then
              echo "MISSING: $path" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "" >&2
            echo "Artifact names do not match what the publish job expects." >&2
            echo "The release tag format and goreleaser's .Version have diverged." >&2
            echo "Actually produced:" >&2
            ls -1 dist/*.tar.gz >&2 || true
            exit 1
          fi
          echo "all four artifacts named as publish expects"

      # Render the formula against the real checksums and assert the result is
      # valid Ruby with no leftover placeholders — the same rendering the
      # release performs, minus the push.
      - name: Render and validate the Homebrew formula
        run: |
          set -euo pipefail
          VERSION="${PROBE_VERSION}"
          echo "probe version: $VERSION"
          sha_for() {
            local f="$1" s
            s=$(awk -v want="$f" '$2 == want { print $1 }' dist/checksums.txt)
            if [ -z "$s" ]; then echo "missing checksum for ${f}" >&2; exit 1; fi
            echo "$s"
          }
          sed -e "s|{{VERSION}}|${VERSION}|g" \
              -e "s|{{TAG}}|loco-v${VERSION}|g" \
              -e "s|{{SHA256_DARWIN_ARM64}}|$(sha_for "loco_${VERSION}_darwin_arm64.tar.gz")|g" \
              -e "s|{{SHA256_DARWIN_AMD64}}|$(sha_for "loco_${VERSION}_darwin_amd64.tar.gz")|g" \
              -e "s|{{SHA256_LINUX_ARM64}}|$(sha_for "loco_${VERSION}_linux_arm64.tar.gz")|g" \
              -e "s|{{SHA256_LINUX_AMD64}}|$(sha_for "loco_${VERSION}_linux_amd64.tar.gz")|g" \
              packaging/loco-formula.template.rb > /tmp/loco.rb
          if grep -q "{{" /tmp/loco.rb; then
            echo "unsubstituted placeholder in rendered formula:" >&2
            grep -n "{{" /tmp/loco.rb >&2
            exit 1
          fi
          ruby -c /tmp/loco.rb

      - name: Validate release-please config
        run: |
          set -euo pipefail
          jq -e . release-please-config.json > /dev/null
          jq -e . .release-please-manifest.json > /dev/null
          # The manifest version must be the single source release-please reads;
          # an empty or absent "." key silently restarts versioning at 0.0.1.
          V=$(jq -r '."."' .release-please-manifest.json)
          if [ -z "$V" ] || [ "$V" = "null" ]; then
            echo "manifest is missing the '.' version key" >&2
            exit 1
          fi
          echo "manifest version: $V"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...
