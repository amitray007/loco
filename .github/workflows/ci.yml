name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (short)
        run: go test -short ./...

      - name: Test (race, short)
        run: go test -race -short ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build linux/amd64
        run: GOOS=linux GOARCH=amd64 go build ./cmd/loco
        env:
          CGO_ENABLED: 0

      - name: Build linux/arm64
        run: GOOS=linux GOARCH=arm64 go build ./cmd/loco
        env:
          CGO_ENABLED: 0

      - name: Build darwin/amd64
        run: GOOS=darwin GOARCH=amd64 go build ./cmd/loco
        env:
          CGO_ENABLED: 0

      - name: Build darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go build ./cmd/loco
        env:
          CGO_ENABLED: 0

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # v9 + golangci-lint v2 are required: the v6 action pulled a lint binary built
      # with go1.24, which refuses to load a module targeting go1.26.1
      # ("the Go language version used to build golangci-lint is lower than the
      # targeted Go version"). Pin the major so a future v1-era default can't regress it.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
