version: 2

project_name: loco

before:
  hooks:
    - go mod tidy

builds:
  - id: loco
    main: ./cmd/loco
    binary: loco
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: loco
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next+{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance improvements
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999

# Homebrew publishing is deliberately NOT done by goreleaser.
#
# goreleaser's `homebrew_casks` points the cask's download URL at this repo's
# release assets. loco is a PRIVATE repo, and Homebrew fetches assets
# unauthenticated, so those URLs 404 for anyone running `brew install` —
# verified directly: a loco release asset returns 404 while the same artifact
# on the public tap returns 200. The cask would install nothing.
#
# Instead, .github/workflows/release-please.yml uploads these same artifacts to
# a release on the PUBLIC amitray007/homebrew-tap and renders
# packaging/loco-formula.template.rb against them. That also keeps the `test do`
# block, which casks cannot express.
#
# If loco is ever made public, this decision can be revisited: goreleaser could
# own the tap push again and the separate tap release becomes redundant.

release:
  github:
    owner: amitray007
    name: loco
  # Not a draft: the release must be publicly visible the moment the Release PR
  # merges, since that is the artifact humans and the tap job both reference.
  draft: false
